# Linux reconstruction environment for the compact workflow.
# This is not a complete historical lock file. See README.md for the additional
# archived scTenifold packages and the existing trajectory-environment requirement.
name: maize-heterosis-analysis
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Versions recorded for the relative-MMD analysis.
  - python=3.10.18
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.13.1
  - scikit-learn=1.7.2
  - scanpy=1.11.5
  - anndata=0.11.4
  # R 4.4 and Bioconductor 3.20 package families.
  - r-base=4.4.2
  - r-seurat=5.2.1
  - r-seuratobject=5.0.2
  - r-sctransform=0.4.1
  - r-dplyr=1.1.4
  - r-readr=2.1.5
  - r-stringr=1.5.1
  - r-tidyr=1.3.1
  - r-tibble=3.2
  - r-ggplot2=3.5.2
  - r-patchwork=1.3.0
  - r-ggpointdensity=0.1.0
  - r-viridis=0.6.5
  - r-data.table=1.17.0
  - r-matrix
  - r-rspectra
  - r-rhpcblasctl
  - r-pbapply
  - r-mass
  - r-remotes
  - r-biocmanager
  - bioconductor-deseq2=1.46
  - bioconductor-apeglm=1.28
  - bioconductor-singlecellexperiment=1.28
  - bioconductor-fgsea=1.32
  - bioconductor-clusterprofiler=4.14
